<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <link href="css/estilos.css" rel="stylesheet" />
    <!-- FUENTE TÍTULOS IMPORTANTES-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet"/>
    <!--FUENTE TEXTO-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet"/>
    <title>TP1 - DADOS</title>
  </head>

  <body>
    <div class="contenedor">
      <header>
        <h1>DADOS</h1>
        <nav>
          <ul>
            <li><a href="index.html">INICIO</a></li>
            <li><a href="cartas.html">CARTAS</a></li>
            <li><a href="dados.html">DADOS</a></li>
            <li><a href="trivia.html">TRIVIA</a></li>
            <li><a href="puntajes.html">PUNTAJES</a></li>
            <li><a href="nosotros.html">INFO</a></li>
          </ul>
        </nav>
      </header>

      <main>
        <div id="tablero-dados">
          <div id="barra-superior">
            <div id="info-partida">
              <p id="timer-dados">Tiempo <span id="tiempo">60</span></p>
              <p id="prohibido-dados">
                N° Prohibido <span id="numero-prohibido"></span>
              </p>
            </div>

            <div id="info-jugador">
              <h2>Jugador</h2>
              <p>Vida <span id="vida-jugador">30</span></p>
              <p>Puntos <span id="puntos-jugador">0</span></p>
            </div>

            <div id="info-pc">
              <h2>PC</h2>
              <p>Vida <span id="vida-pc">30</span></p>
              <p>Puntos <span id="puntos-pc">0</span></p>
            </div>
          </div>
          <button type="button" id="iniciar-partida">Iniciar Partida</button>
          <div id="dados">
            <div id="dado1">
              <img id="img-dado1" src="img/dado1.png" alt="Dado 1" />
            </div>
            <div id="dado2">
              <img id="img-dado2" src="img/dado1.png" alt="Dado 2" />
            </div>
            <button type="button" id="tirar-dados">Tirar dados</button>
            <p>Suma: <span id="resultado-final"></span></p>
          </div>
          <p id="mensaje-dados"></p>
          <div id="acciones-jugador">
            <button type="button" id="sumar">Sumar</button>
            <button type="button" id="atacar">Atacar</button>
            <button type="button" id="plantarse">Plantarse</button>
          </div>
        </div>
      </main>

      <footer>
        <div id="footer-integrantes">
          <h3>INTEGRANTES:</h3>
          <a href="https://github.com/pablo-osuna-vargas">Pablo Osuna Vargas</a>
          <a href="https://github.com/">Joel Ledezma</a>
        </div>

        <div id="footer-juegos">
          <h3>JUEGOS:</h3>
          <a href="cartas.html">Cartas</a>
          <a href="dados.html">Dados</a>
          <a href="trivia.html">Trivia</a>
        </div>
      </footer>
    </div>

    <script src="js/dados.js"></script>
  </body>
</html>
